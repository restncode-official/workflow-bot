<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f1419;
            --bg-elevated: #1a222d;
            --bg-panel: rgba(26, 34, 45, 0.85);
            --border: rgba(148, 163, 184, 0.12);
            --text: #e8eef6;
            --muted: #8b9bb0;
            --accent: #3ecf8e;
            --accent-soft: rgba(62, 207, 142, 0.15);
            --accent-hover: #2fb87a;
            --danger: #ff6b6b;
            --radius: 16px;
            --input-bg: rgba(15, 20, 25, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(ellipse 80% 50% at 10% -10%, rgba(62, 207, 142, 0.12), transparent 50%),
                radial-gradient(ellipse 60% 40% at 90% 0%, rgba(77, 171, 247, 0.1), transparent 45%),
                linear-gradient(180deg, #0c1015 0%, var(--bg) 40%, #12181f 100%);
            padding: 2rem 1.25rem 3rem;
        }

        .wrap { max-width: 1120px; margin: 0 auto; }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .brand { display: flex; flex-direction: column; gap: 0.35rem; }

        .brand-mark {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
        }

        h1 {
            font-size: clamp(1.75rem, 4vw, 2.25rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.15;
        }

        .subtitle { color: var(--muted); font-size: 0.95rem; max-width: 28rem; }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 500;
            font-family: 'JetBrains Mono', monospace;
        }

        .status::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 3px rgba(62, 207, 142, 0.25);
            animation: pulse 2s ease-in-out infinite;
        }

        .status.is-error {
            background: rgba(255, 107, 107, 0.12);
            color: var(--danger);
        }

        .status.is-error::before {
            background: var(--danger);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.2);
            animation: none;
        }

        .status.is-loading {
            color: var(--muted);
            background: rgba(148, 163, 184, 0.1);
        }

        .status.is-loading::before {
            background: var(--muted);
            box-shadow: none;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .toolbar, .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(8px);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.85rem;
            align-items: flex-end;
            padding: 1rem 1.15rem;
            margin-bottom: 1.25rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-width: 140px;
            flex: 1;
        }

        .field label {
            font-size: 0.75rem;
            color: var(--muted);
            font-weight: 500;
        }

        input[type="date"], select {
            appearance: none;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 0.55rem 0.75rem;
            font: inherit;
            font-size: 0.9rem;
            width: 100%;
        }

        input:focus, select:focus {
            outline: none;
            border-color: rgba(62, 207, 142, 0.45);
        }

        .presets {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            align-items: center;
        }

        .btn {
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            border-radius: 10px;
            padding: 0.55rem 0.9rem;
            font: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .btn:hover { border-color: rgba(148, 163, 184, 0.35); }

        .btn-primary {
            background: var(--accent);
            border-color: transparent;
            color: #062016;
        }

        .btn-primary:hover { background: var(--accent-hover); }

        .btn-sm { padding: 0.35rem 0.65rem; font-size: 0.8rem; }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .stat {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.15rem 1.25rem;
            backdrop-filter: blur(8px);
        }

        .stat-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        .stat-value span {
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 400;
            margin-left: 0.25rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
        }

        .panel { padding: 1.35rem; }
        .panel.wide { grid-column: 1 / -1; }

        .panel h2 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .chart-container { position: relative; height: 280px; width: 100%; }
        .panel.wide .chart-container { height: 300px; }

        .error {
            display: none;
            margin-bottom: 1.25rem;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.25);
            color: #ffc9c9;
            font-size: 0.9rem;
        }

        .empty {
            display: none;
            text-align: center;
            color: var(--muted);
            padding: 2rem 1rem;
            font-size: 0.95rem;
        }

        @media (max-width: 800px) {
            .summary { grid-template-columns: 1fr; }
            .grid { grid-template-columns: 1fr; }
            .chart-container, .panel.wide .chart-container { height: 240px; }
            .toolbar .field { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <div class="brand">
                <div class="brand-mark">Workflow</div>
                <h1>Analytics</h1>
                <p class="subtitle">Voice-channel time tracked across projects and teammates.</p>
            </div>
            <div class="status is-loading" id="statusBadge">Loading</div>
        </header>

        <p class="error" id="errorMsg"></p>

        <form class="toolbar" id="filterForm">
            <div class="field">
                <label for="fromDate">From</label>
                <input type="date" id="fromDate" name="from">
            </div>
            <div class="field">
                <label for="toDate">To</label>
                <input type="date" id="toDate" name="to">
            </div>
            <div class="field">
                <label for="userFilter">User</label>
                <select id="userFilter" name="userId">
                    <option value="">All users</option>
                </select>
            </div>
            <div class="presets">
                <button type="button" class="btn btn-sm" data-range="7">7d</button>
                <button type="button" class="btn btn-sm" data-range="30">30d</button>
                <button type="button" class="btn btn-sm" data-range="all">All</button>
                <button type="submit" class="btn btn-primary">Apply</button>
            </div>
        </form>

        <div class="summary" id="summary">
            <div class="stat">
                <div class="stat-label">Total hours</div>
                <div class="stat-value" id="statHours">—</div>
            </div>
            <div class="stat">
                <div class="stat-label">Active projects</div>
                <div class="stat-value" id="statProjects">—</div>
            </div>
            <div class="stat">
                <div class="stat-label">Tracked users</div>
                <div class="stat-value" id="statUsers">—</div>
            </div>
        </div>

        <p class="empty" id="emptyMsg">No work logs for this filter. Join a project voice channel to start tracking.</p>

        <div class="grid" id="charts">
            <div class="panel">
                <h2>Projects overview</h2>
                <div class="chart-container">
                    <canvas id="projectChart"></canvas>
                </div>
            </div>
            <div class="panel">
                <h2>Top users</h2>
                <div class="chart-container">
                    <canvas id="userChart"></canvas>
                </div>
            </div>
            <div class="panel wide">
                <h2>Daily activity</h2>
                <div class="chart-container">
                    <canvas id="timelineChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const COLORS = ['#3ecf8e', '#4dabf7', '#ffd43b', '#ff8787', '#9775fa', '#63e6be', '#74c0fc'];
        const toHours = seconds => +(seconds / 3600).toFixed(2);
        const formatHours = h => Number(h).toLocaleString(undefined, { maximumFractionDigits: 1 });
        const isoDate = d => d.toISOString().slice(0, 10);

        Chart.defaults.color = '#8b9bb0';
        Chart.defaults.borderColor = 'rgba(148, 163, 184, 0.12)';
        Chart.defaults.font.family = "'Outfit', sans-serif";

        const charts = { project: null, user: null, timeline: null };
        const tooltip = {
            backgroundColor: '#1a222d',
            titleColor: '#e8eef6',
            bodyColor: '#8b9bb0',
            borderColor: 'rgba(148, 163, 184, 0.2)',
            borderWidth: 1,
            padding: 10,
            cornerRadius: 8
        };

        function qs(params) {
            const q = new URLSearchParams();
            Object.entries(params).forEach(([k, v]) => { if (v) q.set(k, v); });
            const s = q.toString();
            return s ? `?${s}` : '';
        }

        function currentFilters() {
            return {
                from: document.getElementById('fromDate').value,
                to: document.getElementById('toDate').value,
                userId: document.getElementById('userFilter').value
            };
        }

        async function fetchJSON(endpoint) {
            const res = await fetch(endpoint);
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            return data;
        }

        function setStatus(text, state) {
            const el = document.getElementById('statusBadge');
            el.textContent = text;
            el.className = 'status' + (state ? ` is-${state}` : '');
        }

        function destroyCharts() {
            Object.keys(charts).forEach(k => {
                if (charts[k]) { charts[k].destroy(); charts[k] = null; }
            });
        }

        async function loadUsers() {
            const users = await fetchJSON('/api/workflow/users');
            const select = document.getElementById('userFilter');
            const current = select.value;
            select.innerHTML = '<option value="">All users</option>';
            users.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.userId;
                opt.textContent = u.userName || u.userId;
                select.appendChild(opt);
            });
            if ([...select.options].some(o => o.value === current)) select.value = current;
        }

        async function loadDashboard() {
            setStatus('Loading', 'loading');
            document.getElementById('errorMsg').style.display = 'none';

            try {
                const q = qs(currentFilters());
                const [projects, users, timeline] = await Promise.all([
                    fetchJSON('/api/workflow/stats' + q),
                    fetchJSON('/api/workflow/leaderboard' + q),
                    fetchJSON('/api/workflow/timeline' + q)
                ]);

                const totalHours = projects.reduce((sum, d) => sum + toHours(d.totalSeconds), 0);
                document.getElementById('statHours').innerHTML =
                    `${formatHours(totalHours)}<span>h</span>`;
                document.getElementById('statProjects').textContent = projects.length;
                document.getElementById('statUsers').textContent = users.length;

                const empty = !projects.length && !users.length && !timeline.length;
                document.getElementById('emptyMsg').style.display = empty ? 'block' : 'none';
                document.getElementById('charts').style.opacity = empty ? '0.55' : '1';

                destroyCharts();

                charts.project = new Chart(document.getElementById('projectChart'), {
                    type: 'doughnut',
                    data: {
                        labels: projects.map(d => d.projectName || 'Unknown'),
                        datasets: [{
                            data: projects.map(d => toHours(d.totalSeconds)),
                            backgroundColor: COLORS,
                            borderWidth: 0,
                            hoverOffset: 6
                        }]
                    },
                    options: {
                        maintainAspectRatio: false,
                        cutout: '68%',
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { boxWidth: 10, padding: 14, usePointStyle: true }
                            },
                            tooltip: {
                                ...tooltip,
                                callbacks: { label: ctx => ` ${formatHours(ctx.raw)} h` }
                            }
                        }
                    }
                });

                charts.user = new Chart(document.getElementById('userChart'), {
                    type: 'bar',
                    data: {
                        labels: users.map(d => d.userName || d.userId),
                        datasets: [{
                            label: 'Hours',
                            data: users.map(d => toHours(d.totalSeconds)),
                            backgroundColor: 'rgba(77, 171, 247, 0.75)',
                            borderRadius: 6,
                            borderSkipped: false,
                            maxBarThickness: 28
                        }]
                    },
                    options: {
                        maintainAspectRatio: false,
                        indexAxis: 'y',
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                ...tooltip,
                                callbacks: { label: ctx => ` ${formatHours(ctx.raw)} h` }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(148, 163, 184, 0.08)' },
                                ticks: { callback: v => `${v}h` }
                            },
                            y: {
                                grid: { display: false },
                                ticks: {
                                    font: { family: "'Outfit', sans-serif", size: 12 },
                                    callback(value) {
                                        const label = this.getLabelForValue(value);
                                        return label.length > 16 ? label.slice(0, 14) + '…' : label;
                                    }
                                }
                            }
                        }
                    }
                });

                charts.timeline = new Chart(document.getElementById('timelineChart'), {
                    type: 'line',
                    data: {
                        labels: timeline.map(d => {
                            const date = new Date(d.date + 'T00:00:00');
                            return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                        }),
                        datasets: [{
                            label: 'Hours',
                            data: timeline.map(d => toHours(d.totalSeconds)),
                            borderColor: '#3ecf8e',
                            backgroundColor: 'rgba(62, 207, 142, 0.12)',
                            borderWidth: 2.5,
                            tension: 0.35,
                            fill: true,
                            pointRadius: 0,
                            pointHoverRadius: 5,
                            pointHoverBackgroundColor: '#3ecf8e'
                        }]
                    },
                    options: {
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                ...tooltip,
                                callbacks: { label: ctx => ` ${formatHours(ctx.raw)} h` }
                            }
                        },
                        scales: {
                            x: {
                                grid: { display: false },
                                ticks: { maxRotation: 0, autoSkipPadding: 16 }
                            },
                            y: {
                                beginAtZero: true,
                                grid: { color: 'rgba(148, 163, 184, 0.08)' },
                                ticks: { callback: v => `${v}h` }
                            }
                        }
                    }
                });

                setStatus('Live', '');
            } catch (err) {
                const el = document.getElementById('errorMsg');
                el.textContent = 'Could not load dashboard: ' + err.message;
                el.style.display = 'block';
                setStatus('Offline', 'error');
                console.error(err);
            }
        }

        document.getElementById('filterForm').addEventListener('submit', e => {
            e.preventDefault();
            loadDashboard();
        });

        document.querySelectorAll('[data-range]').forEach(btn => {
            btn.addEventListener('click', () => {
                const range = btn.dataset.range;
                const to = new Date();
                const from = new Date();
                if (range === 'all') {
                    document.getElementById('fromDate').value = '';
                    document.getElementById('toDate').value = '';
                } else {
                    from.setDate(to.getDate() - Number(range) + 1);
                    document.getElementById('fromDate').value = isoDate(from);
                    document.getElementById('toDate').value = isoDate(to);
                }
                loadDashboard();
            });
        });

        (() => {
            const to = new Date();
            const from = new Date();
            from.setDate(to.getDate() - 29);
            document.getElementById('fromDate').value = isoDate(from);
            document.getElementById('toDate').value = isoDate(to);
        })();

        Promise.all([loadUsers(), loadDashboard()]).catch(console.error);
    </script>
</body>
</html>
